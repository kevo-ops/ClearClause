<!DOCTYPE html>
<html>
<head>
  <title>ClearClause Summarizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>ClearClause Summarizer</h1>
  <p id="status"></p>
  <textarea id="manualInput" placeholder="Paste privacy policy text here..."></textarea>
  <button id = "clear">Clear</button>
  <button id="summarize">Summarize Privacy Policy</button>
  <p>Click the summarize button if you are already on the page, need to search for the link, or have pasted a privacy policy in the box above.</p>
  <button id = "cancel">Cancel Summary</button>
  <script src="popup.js"></script>
  
</body>
</html>
